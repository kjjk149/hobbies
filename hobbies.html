<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Hobbies</title>
        <style>     
            body {
                background-color: #f0f0f0;
                font-family: Arial, sans-serif;
                text-align: center;
                padding: 50px;
            }
            h1 {
                color: #333;
            }
            p {
                color: #666;
            }
            button {
                padding: 10px 20px;
                font-size: 16px;
                margin: 10px;
                cursor: pointer;
            }
        </style>
    </head>     
    <body>
        <h1>My Hobbies</h1>
        <p>Click the button below to see a fun message about my hobbies!</p>
        <button onclick="showMessage()">Click Me!</button>
        <p id="message"></p>
        <script>
            function showMessage() {
                document.getElementById("message").innerHTML = "I love coding, playing video games, and exploring new technologies!";
            }
        </script>
    </body>
</html>
